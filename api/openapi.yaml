components:
  schemas:
    br.com.concordia.infrastructure.cronograma.CronogramaController.DependenciasRequest:
      type: object
      properties:
        predecessores:
          type: array
          items:
            type: string
            format: uuid
      required:
      - predecessores
    br.com.concordia.infrastructure.obra.dtos.ObraRequest:
      type: object
      properties:
        descricao:
          type: string
          minLength: 1
        uf:
          type: string
          enum:
          - AC
          - AL
          - AP
          - AM
          - BA
          - CE
          - DF
          - ES
          - GO
          - MA
          - MT
          - MS
          - MG
          - PA
          - PB
          - PR
          - PE
          - PI
          - RJ
          - RN
          - RS
          - RO
          - RR
          - SC
          - SP
          - SE
          - TO
        fusoHorario:
          type: string
        idEmpresa:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - descricao
      - fusoHorario
      - uf
    br.com.concordia.infrastructure.obra.dtos.ObraResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        descricao:
          type: string
        status:
          type: string
          enum:
          - EM_ANDAMENTO
          - CONCLUIDA
          - CANCELADA
          - EM_PLANEJAMENTO
          - PAUSADA
        id_empresa:
          type: string
          format: uuid
        uf:
          type: string
          enum:
          - AC
          - AL
          - AP
          - AM
          - BA
          - CE
          - DF
          - ES
          - GO
          - MA
          - MT
          - MS
          - MG
          - PA
          - PB
          - PR
          - PE
          - PI
          - RJ
          - RN
          - RS
          - RO
          - RR
          - SC
          - SP
          - SE
          - TO
        fusoHorario:
          type: string
    br.com.concordia.infrastructure.insumo.dtos.InsumoRequest:
      type: object
      properties:
        codigo:
          type: string
          minLength: 1
        descricao:
          type: string
          minLength: 1
        unidade:
          type: string
          enum:
          - KG
          - G
          - T
          - M
          - M2
          - M3
          - KM
          - KM/T
          - M3XKM
          - H
