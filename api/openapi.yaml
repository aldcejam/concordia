openapi: 3.0.3
info:
  title: Concordia API
  version: 0.1.0
servers:
  - url: http://localhost:8080
tags:
  - name: Health
paths:
  /api/health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Verifica a disponibilidade da API
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/obras/{id}/etapas:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Obras
      operationId: listarEtapasDaObra
      summary: Lista etapas e itens EAP associados à obra
      responses:
        '200':
          description: Etapas da obra
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EtapaResponse'
        '404':
          description: Obra não encontrada
    post:
      tags:
        - Obras
      operationId: criarEtapaDaObra
      summary: Cria uma etapa e seu nó EAP na obra
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EtapaRequest'
      responses:
        '201':
          description: Etapa criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtapaResponse'
        '400':
          description: Dados inválidos ou item pai inexistente
        '404':
          description: Obra não encontrada
  /api/obras/{id}/etapas/{etapaId}/medicoes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: etapaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Obras
      operationId: registrarMedicaoDaEtapa
      summary: Registra uma medição e preserva seu histórico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicaoRequest'
      responses:
        '200':
          description: Etapa atualizada com a nova medição
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtapaResponse'
        '400':
          description: Dados da medição inválidos
        '404':
          description: Obra ou etapa não encontrada
        '409':
          description: Etapa bloqueada por predecessora obrigatória pendente (RN02)
  /api/obras/{id}/etapas/{etapaId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: etapaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Obras
      operationId: consultarEtapaDaObra
      summary: Consulta uma etapa e seu histórico de medições
      responses:
        '200':
          description: Etapa encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtapaResponse'
  /api/obras/{id}/etapas/{etapaId}/orcamento:
    patch:
      tags: [Obras]
      summary: Atualizar dados do orçamento de uma etapa
      operationId: atualizarDadosOrcamento
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: etapaId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EtapaRequest'
      responses:
        '200':
          description: Dados orçamentários atualizados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtapaResponse'
        '404':
          description: Obra ou etapa não encontrada
  /api/obras/{id}/analise-atraso:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Obras
      operationId: analisarAtrasoObra
      summary: Analisa atraso de uma etapa e sugere opções de adiantamento com IA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SugestaoAtrasoRequest'
      responses:
        '200':
          description: Sugestões de etapas para adiantamento geradas pela IA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReprogramacaoSimplificadaResponse'
  /api/obras/{id}/reordenar-etapa:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Obras
      operationId: reordenarEtapaObra
      summary: Reordena uma etapa adiantada para ficar logo após a etapa atrasada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReordenarEtapaRequest'
      responses:
        '200':
          description: Lista atualizada de etapas da obra
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EtapaResponse'
        '400':
          description: Dados inválidos
        '404':
          description: Obra ou etapa não encontrada
  /api/obras/importacoes/pre-visualizacao:
    post:
      tags:
        - Importação de Orçamento
      operationId: preVisualizarPlanilha
      summary: UC01 — valida a planilha orçamentária e devolve o resumo da EAP sem persistir
      description: >-
        Reconhece a planilha analítica SINAPI (blocos de composição) e a planilha sintética com cabeçalhos
        sinônimos (RNF05). Sempre responde 200; erros de parsing vêm em `erros` e `valida` indica se é possível importar.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo:
                  type: string
                  format: binary
                  description: Planilha .xlsx ou .xls (até 20 MB)
      responses:
        '200':
          description: Resumo da importação (válida ou com relatório de erros)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumoImportacaoResponse'
        '400':
          description: Arquivo ausente, vazio ou com extensão não suportada
        '413':
          description: Arquivo maior que 20 MB
  /api/obras/importacoes:
    post:
      tags:
        - Importação de Orçamento
      operationId: importarPlanilha
      summary: UC01 — cria a obra com macroetapas, subetapas e itens de serviço a partir da planilha
      parameters:
        - name: descricao
          in: query
          required: false
          description: Descrição da obra; quando omitida usa o nome encontrado na planilha
          schema:
            type: string
        - name: uf
          in: query
          required: true
          schema:
            type: string
            enum: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
        - name: fusoHorario
          in: query
          required: false
          schema:
            type: string
            default: America/Sao_Paulo
        - name: idEmpresa
          in: query
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Obra criada e EAP persistida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportacaoPlanilhaResponse'
        '400':
          description: Arquivo ou parâmetros inválidos
        '404':
          description: Empresa não encontrada
        '422':
          description: Planilha inválida; `erros` traz o relatório por linha/coluna
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PlanilhaInvalidaProblem'
  /api/obras/{id}/dependencias:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Dependências
      operationId: listarDependencias
      summary: UC06 — lista os vínculos de precedência da obra
      responses:
        '200':
          description: Dependências configuradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DependenciaResponse'
        '404':
          description: Obra não encontrada
    post:
      tags:
        - Dependências
      operationId: criarDependencia
      summary: UC06 — cria um vínculo de precedência entre duas etapas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependenciaRequest'
      responses:
        '201':
          description: Vínculo criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependenciaResponse'
        '400':
          description: Dados inválidos ou etapa dependendo de si mesma
        '404':
          description: Obra ou etapa não encontrada
        '409':
          description: Vínculo duplicado ou que criaria um ciclo na EAP (o caminho do ciclo vem em `detail`)
  /api/obras/{id}/dependencias/{dependenciaId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: dependenciaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - Dependências
      operationId: atualizarDependencia
      summary: UC06 — altera tipo, desfasamento ou obrigatoriedade do vínculo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependenciaParcialRequest'
      responses:
        '200':
          description: Vínculo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependenciaResponse'
        '404':
          description: Obra ou dependência não encontrada
    delete:
      tags:
        - Dependências
      operationId: removerDependencia
      summary: UC06 — remove o vínculo de precedência
      responses:
        '204':
          description: Vínculo removido
        '404':
          description: Obra ou dependência não encontrada
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: UP
    EtapaRequest:
      type: object
      required: [nome, descricao]
      properties:
        nome:
          type: string
        descricao:
          type: string
        inicio:
          type: string
          format: date-time
          nullable: true
        prazoEsperadoDias:
          type: integer
          minimum: 1
          nullable: true
        idItemPai:
          type: string
          format: uuid
          nullable: true
        posicao:
          type: number
          minimum: 0
        codigoEap:
          type: string
          nullable: true
        bancoOrcamento:
          type: string
          nullable: true
        codigoComposicao:
          type: string
          nullable: true
        tipoComposicao:
          type: string
          nullable: true
        macroetapa:
          type: string
          nullable: true
        unidadeOrcamento:
          type: string
          nullable: true
        quantidadeOrcada:
          type: number
          minimum: 0
          nullable: true
        valorUnitarioOrcado:
          type: number
          minimum: 0
          nullable: true
        valorUnitarioBase:
          type: number
          minimum: 0
          nullable: true
        percentualBdi:
          type: number
          minimum: 0
          nullable: true
        valorTotalOrcado:
          type: number
          minimum: 0
          nullable: true
    MedicaoRequest:
      type: object
      required: [percentualExecutado, quantidadeExecutada]
      properties:
        percentualExecutado:
          type: number
          minimum: 0
          maximum: 100
        quantidadeExecutada:
          type: number
          minimum: 0
        observacao:
          type: string
          nullable: true
        motivoAtraso:
          type: string
          nullable: true
        diasAtraso:
          type: integer
          minimum: 0
          nullable: true
    EtapaResponse:
      type: object
      required: [id, idItemEap, nome, descricao, posicao, percentualExecutado, quantidadeExecutada, medicoes]
      properties:
        id:
          type: string
          format: uuid
        idItemEap:
          type: string
          format: uuid
        idItemPai:
          type: string
          format: uuid
          nullable: true
        nome:
          type: string
        descricao:
          type: string
        posicao:
          type: number
        inicio:
          type: string
          format: date-time
        fim:
          type: string
          format: date-time
          nullable: true
        prazoEsperadoDias:
          type: integer
          nullable: true
        percentualExecutado:
          type: number
        quantidadeExecutada:
          type: number
        motivoAtraso:
          type: string
          nullable: true
        diasAtraso:
          type: integer
          nullable: true
        codigoEap:
          type: string
          nullable: true
        bancoOrcamento:
          type: string
          nullable: true
        codigoComposicao:
          type: string
          nullable: true
        tipoComposicao:
          type: string
          nullable: true
        macroetapa:
          type: string
          nullable: true
        unidadeOrcamento:
          type: string
          nullable: true
        quantidadeOrcada:
          type: number
          nullable: true
        valorUnitarioOrcado:
          type: number
          nullable: true
        valorUnitarioBase:
          type: number
          nullable: true
        percentualBdi:
          type: number
          nullable: true
        valorTotalOrcado:
          type: number
          nullable: true
        medicoes:
          type: array
          items:
            $ref: '#/components/schemas/MedicaoResponse'
        pesoPercentual:
          type: number
          description: Participação do item no valor total orçado da obra (%)
        bloqueada:
          type: boolean
          description: RN02 — verdadeiro enquanto houver predecessora obrigatória não satisfeita
        predecessoras:
          type: array
          items:
            $ref: '#/components/schemas/VinculoEtapaResponse'
        sucessoras:
          type: array
          items:
            $ref: '#/components/schemas/VinculoEtapaResponse'
    MedicaoResponse:
      type: object
      required: [id, percentualExecutado, quantidadeExecutada, registradaEm]
      properties:
        id:
          type: string
          format: uuid
        percentualExecutado:
          type: number
        quantidadeExecutada:
          type: number
        observacao:
          type: string
          nullable: true
        motivoAtraso:
          type: string
          nullable: true
        diasAtraso:
          type: integer
          nullable: true
        registradaEm:
          type: string
          format: date-time
    SugestaoAtrasoRequest:
      type: object
      required: [etapaId, motivo, diasAtraso]
      properties:
        etapaId:
          type: string
          format: uuid
        motivo:
          type: string
        diasAtraso:
          type: integer
    SugestaoEtapaResponse:
      type: object
      required: [etapaId, codigoEap, nome, justificativa]
      properties:
        etapaId:
          type: string
          format: uuid
        codigoEap:
          type: string
        nome:
          type: string
        justificativa:
          type: string
    ReprogramacaoSimplificadaResponse:
      type: object
      required: [etapaAtrasadaId, etapaAtrasadaCodigo, etapaAtrasadaNome, motivo, diasAtraso, mensagem, sugestoes]
      properties:
        etapaAtrasadaId:
          type: string
          format: uuid
        etapaAtrasadaCodigo:
          type: string
        etapaAtrasadaNome:
          type: string
        motivo:
          type: string
        diasAtraso:
          type: integer
        mensagem:
          type: string
          description: Parecer técnico descritivo da IA ou justificativa caso não tenha conseguido identificar etapas
        sugestoes:
          type: array
          items:
            $ref: '#/components/schemas/SugestaoEtapaResponse'
    ReordenarEtapaRequest:
      type: object
      required: [etapaAtrasadaId, etapaAdiantadaId]
      properties:
        etapaAtrasadaId:
          type: string
          format: uuid
        etapaAdiantadaId:
          type: string
          format: uuid
    TipoDependencia:
      type: string
      enum: [FI, II, FF]
      description: FI = Fim→Início, II = Início→Início, FF = Fim→Fim
    DependenciaRequest:
      type: object
      required: [predecessoraId, sucessoraId]
      properties:
        predecessoraId:
          type: string
          format: uuid
        sucessoraId:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoDependencia'
        desfasamentoDias:
          type: integer
          minimum: -365
          maximum: 365
          default: 0
        obrigatoria:
          type: boolean
          default: true
    DependenciaParcialRequest:
      type: object
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDependencia'
        desfasamentoDias:
          type: integer
          minimum: -365
          maximum: 365
        obrigatoria:
          type: boolean
    EtapaDependenciaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigoEap:
          type: string
          nullable: true
        nome:
          type: string
    DependenciaResponse:
      type: object
      required: [id, predecessora, sucessora, tipo, desfasamentoDias, obrigatoria, satisfeita]
      properties:
        id:
          type: string
          format: uuid
        predecessora:
          $ref: '#/components/schemas/EtapaDependenciaResponse'
        sucessora:
          $ref: '#/components/schemas/EtapaDependenciaResponse'
        tipo:
          $ref: '#/components/schemas/TipoDependencia'
        desfasamentoDias:
          type: integer
        obrigatoria:
          type: boolean
        satisfeita:
          type: boolean
          description: Se a predecessora já permite o início da sucessora
        criadaEm:
          type: string
          format: date-time
    VinculoEtapaResponse:
      type: object
      properties:
        dependenciaId:
          type: string
          format: uuid
        etapaId:
          type: string
          format: uuid
        codigoEap:
          type: string
          nullable: true
        nome:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoDependencia'
        desfasamentoDias:
          type: integer
        obrigatoria:
          type: boolean
        satisfeita:
          type: boolean
    ErroImportacaoResponse:
      type: object
      properties:
        linha:
          type: integer
          nullable: true
        coluna:
          type: string
          nullable: true
        mensagem:
          type: string
    NoEapResumoResponse:
      type: object
      properties:
        codigoEap:
          type: string
        nome:
          type: string
        itemServico:
          type: boolean
        banco:
          type: string
          nullable: true
          description: Banco de referência; itens sem banco são "Composição Própria"
        codigoComposicao:
          type: string
          nullable: true
        unidade:
          type: string
          nullable: true
        quantidade:
          type: number
          nullable: true
        valorTotal:
          type: number
        pesoPercentual:
          type: number
        quantidadeItens:
          type: integer
        filhos:
          type: array
          items:
            $ref: '#/components/schemas/NoEapResumoResponse'
    ResumoImportacaoResponse:
      type: object
      properties:
        formato:
          type: string
        nomeObra:
          type: string
          nullable: true
        percentualBdi:
          type: number
          nullable: true
        totalItens:
          type: integer
        totalMacroetapas:
          type: integer
        totalSubetapas:
          type: integer
        composicoesProprias:
          type: integer
        valorTotalSemBdi:
          type: number
        valorTotalComBdi:
          type: number
        somaPesos:
          type: number
        valida:
          type: boolean
        eap:
          type: array
          items:
            $ref: '#/components/schemas/NoEapResumoResponse'
        erros:
          type: array
          items:
            $ref: '#/components/schemas/ErroImportacaoResponse'
        avisos:
          type: array
          items:
            type: string
    ImportacaoPlanilhaResponse:
      type: object
      properties:
        idObra:
          type: string
          format: uuid
        descricaoObra:
          type: string
        resumo:
          $ref: '#/components/schemas/ResumoImportacaoResponse'
    PlanilhaInvalidaProblem:
      type: object
      properties:
        title:
          type: string
          example: Planilha Inválida
        status:
          type: integer
          example: 422
        detail:
          type: string
        erros:
          type: array
          items:
            $ref: '#/components/schemas/ErroImportacaoResponse'
