spring:
  application:
    name: concordia-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/concordia}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger
