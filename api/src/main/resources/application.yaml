spring:
  main:
    banner-mode: "off"
  application:
    name: concordia-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

concordia:
  ia:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}

management:
  endpoint:
    health:
      access: read_only

springdoc:
  default-produces-media-type: application/json
  use-fqn: true
